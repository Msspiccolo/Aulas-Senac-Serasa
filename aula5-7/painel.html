<h2 id ="welcome"></h2>
<h3 id = "usuarios" ></h3>

<form id="formRegister">
    Nome: <input 
        id="iName"
        type="text" 
        placeholder="Digite o seu nome completo"
     /> 

    Email: <input 
        id="iEmail"
        type="email" 
        placeholder="Digite o seu melhor email" 
    /><br>

    Password: <input
        id="iPass"
         type="password" 
         placeholder="Letra maiuscula e números"
    /> 
    Data de nascimento 
        <input type="date" 
        id="iBirth"
    /><br>

    <button type="submit"> Salvar </button>

</form>

<pre id="lUsers"></pre>

<script src="user.js"></script>
